name: . 🕵🏼 Trivy scanner for docker
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to scan'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  docker-trivy:
    permissions:
      contents: read
      security-events: write # caller must grant it; component_trivy.yml uploads SARIF on scheduled runs
    uses: ./.github/workflows/component_trivy.yml
    secrets:
      slack_webhook: ${{ secrets.CAOS_SLACK_WEBHOOK }}
    with:
      tag: "${{ github.event.inputs.tag  || 'latest'}}"
      severity: "CRITICAL,HIGH"
